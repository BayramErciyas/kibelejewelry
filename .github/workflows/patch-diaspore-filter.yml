name: Patch Diaspore Filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-diaspore-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Jewellery filter
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Jewellery.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''    const categoryMatches =
      !selectedCategory || productCategory === selectedCategory;
    const stoneMatches =
      !selectedStone || productStone === selectedStone;
    const metalMatches =
      !selectedMetal || productMetal === selectedMetal;
'''

          new = '''    const jewelleryCategories = new Set([
      'rings',
      'necklaces',
      'earrings',
      'bracelets',
      'charms',
    ]);
    const isJewelleryProduct = jewelleryCategories.has(productCategory);
    const hasDiasporeText =
      searchableProductText.includes('diaspor') ||
      searchableProductText.includes('diaspore');
    const isNaturalDiaspore =
      productStone === 'diaspore' ||
      (productStone === 'zultanite' && hasDiasporeText && !isJewelleryProduct);

    const categoryMatches =
      !selectedCategory || productCategory === selectedCategory;
    const stoneMatches =
      !selectedStone ||
      (selectedStone === 'diaspore'
        ? isNaturalDiaspore
        : selectedStone === 'zultanite'
        ? productStone === 'zultanite' && !isNaturalDiaspore
        : productStone === selectedStone);
    const metalMatches =
      !selectedMetal || productMetal === selectedMetal;
'''

          if old not in text:
              raise SystemExit('Expected filter block was not found; no changes made.')
          text = text.replace(old, new, 1)

          old_collection = '''    const collectionMatches =
      selectedCollection !== 'natural-stones' ||
      NATURAL_STONE_KEYS.has(productStone);
'''

          new_collection = '''    const collectionMatches =
      selectedCollection !== 'natural-stones' ||
      (NATURAL_STONE_KEYS.has(productStone) && !isJewelleryProduct);
'''

          if old_collection not in text:
              raise SystemExit('Expected natural-stones block was not found; no changes made.')
          text = text.replace(old_collection, new_collection, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow
        run: rm .github/workflows/patch-diaspore-filter.yml

      - name: Commit patch
        run: |
          git config user.name "Bayram Erciyas"
          git config user.email "161426681+BayramErciyas@users.noreply.github.com"
          git add src/Jewellery.jsx .github/workflows/patch-diaspore-filter.yml
          git commit -m "Zultanite ve Diaspor ürün filtrelerini kodda ayır"
          git push origin main
